# Test stack for RFC 8705 (Mutual-TLS Client Authentication and Certificate-Bound Access Tokens).
#
#   docker compose -f docker/docker-compose.yml run --rm tests
#
# Certificates are generated by docker/scripts/generate-certs.sh before starting the stack.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/opt/keycloak/certs/keycloak.crt
      - --https-certificate-key-file=/opt/keycloak/certs/keycloak.key
      # Request — not require — a client certificate, so the discovery document and the
      # regular endpoints stay reachable without one.
      - --https-client-auth=request
      - --https-trust-store-file=/opt/keycloak/certs/truststore.jks
      - --https-trust-store-password=password
      - --features=token-exchange
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./certs:/opt/keycloak/certs:ro
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      # Keycloak 26 has no curl/wget in the image; use the JVM-less bash /dev/tcp probe.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: https://keycloak:8443
      REALM: mtls
      CERT_DIR: /app/docker/certs
    volumes:
      - ../src:/app/src:ro
      - ../docker:/app/docker:ro
    command: ["php", "/app/docker/tests/rfc8705_test.php"]
